services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nos
      POSTGRES_PASSWORD: nos
      POSTGRES_DB: nos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://nos:nos@db:5432/nos
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
